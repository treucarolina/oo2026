<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="eksam.js"></script>

    <script>

        let videoApp = null;

        function startPage(){
            let videoElement = document.getElementById("video");
            videoApp = new SpeedVideo(videoElement);
        }

        function setVolume(){
            let vol = document.getElementById("volBtn").value;
            videoApp.changeVolume(vol);
        }

        function setSpeed(){
            let speed = document.getElementById("speedBtn").value;
            videoApp.changeSpeed(speed);
            document.getElementById("showSpeed").innerText = speed;
        }

        function pause(){
            video.pause();
            document.getElementById("playBtn").style.display = "";
            document.getElementById("pauseBtn").style.display = "none";
        }

        function play(){
            video.play();
            document.getElementById("pauseBtn").style.display = "";
            document.getElementById("playBtn").style.display = "none";
        }

        function openInfoPopup(){
            popup.classList.add("open-popup");
        }

    </script>
</head>

<body onload="startPage()">
    <video id="video" controls width="600" preload="">
        <source src="Carolina_testimine.mp4" type="video/mp4">
    </video>
    <br>
    <label for="volBtn">Helitugevus: </label>
    <input id="volBtn" type="range" min="0" max="1" step=".01" value=".7" onchange="setVolume()">
    <br>
    <label for="speedBtn">Esituskiirus: </label>
    <input id="speedBtn" type="range" min=".1" max="5" step=".01" value="1" onchange="setSpeed()">
    <p id="showSpeed"></p>
    <br>
    <button id="pauseBtn" onclick="pause()" style="display: none">| |</button>
    <button id="playBtn" onclick="play()"> > </button>
    <br>
    <br>
    <button>info</button>
    <button>questions</button>
    <button>discussion</button>
    <div class="questions" id="popup">
        <p>text</p>
        <button>x</button>
    </div>

    <div class="exerciseInfo" id="popup">
        <p>text</p>
        <button>x</button>
    </div>

    <div class="teacherInfo" id="popup">
        <p>text</p>
        <button>x</button>
    </div>

</body>
</html>
